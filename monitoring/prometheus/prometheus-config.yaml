apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      scrape_timeout: 10s

    rule_files:
      - "/etc/prometheus/alert-rules.yml"

    alerting:
      alertmanagers:
        - static_configs:
            - targets:
                - alertmanager:9093

    scrape_configs:
      - job_name: "prometheus"
        static_configs:
          - targets: ["localhost:9090"]

      - job_name: "kubernetes-apiservers"
        kubernetes_sd_configs:
          - role: endpoints
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
            action: keep
            regex: default;kubernetes;https

      - job_name: "kubernetes-nodes"
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)

      - job_name: "kubernetes-pods"
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: kubernetes_pod_name

      - job_name: "kubernetes-services"
        kubernetes_sd_configs:
          - role: service
        metrics_path: /metrics
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_service_annotation_prometheus_io_port]
            action: replace
            target_label: __address__
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
          - action: labelmap
            regex: __meta_kubernetes_service_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_service_name]
            action: replace
            target_label: kubernetes_service_name

      - job_name: "tetris-app"
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - tetris
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_label_app]
            action: keep
            regex: tetris

  alert-rules.yml: |
    groups:
      - name: tetris-app-alerts
        rules:
          - alert: TetrisAppDown
            expr: up{job="tetris-app"} == 0
            for: 1m
            labels:
              severity: critical
              team: devsecops
            annotations:
              summary: "Tetris application is down"
              description: "Tetris app instance {{ $labels.instance }} has been down for more than 1 minute."

          - alert: TetrisHighCPU
            expr: rate(container_cpu_usage_seconds_total{namespace="tetris"}[5m]) > 0.8
            for: 5m
            labels:
              severity: warning
              team: devsecops
            annotations:
              summary: "Tetris app high CPU usage"
              description: "Tetris pod {{ $labels.pod }} CPU usage is above 80% for 5 minutes."

          - alert: TetrisHighMemory
            expr: container_memory_usage_bytes{namespace="tetris"} / container_spec_memory_limit_bytes{namespace="tetris"} > 0.85
            for: 5m
            labels:
              severity: warning
              team: devsecops
            annotations:
              summary: "Tetris app high memory usage"
              description: "Tetris pod {{ $labels.pod }} memory usage is above 85% for 5 minutes."

          - alert: TetrisPodRestarting
            expr: increase(kube_pod_container_status_restarts_total{namespace="tetris"}[1h]) > 3
            for: 5m
            labels:
              severity: warning
              team: devsecops
            annotations:
              summary: "Tetris pod restarting frequently"
              description: "Tetris pod {{ $labels.pod }} has restarted {{ $value }} times in the last hour."

          - alert: TetrisHighErrorRate
            expr: rate(nginx_http_requests_total{status=~"5.."}[5m]) / rate(nginx_http_requests_total[5m]) > 0.05
            for: 5m
            labels:
              severity: critical
              team: devsecops
            annotations:
              summary: "Tetris app high error rate"
              description: "More than 5% of requests are returning 5xx errors."

          - alert: TetrisHighLatency
            expr: histogram_quantile(0.99, rate(nginx_http_request_duration_seconds_bucket[5m])) > 1
            for: 5m
            labels:
              severity: warning
              team: devsecops
            annotations:
              summary: "Tetris app high latency"
              description: "99th percentile latency is above 1 second."

      - name: kubernetes-alerts
        rules:
          - alert: KubeNodeNotReady
            expr: kube_node_status_condition{condition="Ready",status="true"} == 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Kubernetes node not ready"
              description: "Node {{ $labels.node }} is not ready."

          - alert: KubePodCrashLooping
            expr: increase(kube_pod_container_status_restarts_total[15m]) > 3
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Kubernetes pod crash looping"
              description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is crash looping."

          - alert: KubeDeploymentReplicasMismatch
            expr: kube_deployment_spec_replicas != kube_deployment_status_ready_replicas
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "Deployment replica mismatch"
              description: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} has {{ $value }} replicas mismatch."
